version: '3.8'

services:
  # PostgreSQL Database
  postgres-auth:
    image: postgres:15-alpine
    container_name: crediya-postgres-auth
    environment:
      POSTGRES_DB: crediya_authentication_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nueva_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./deployment/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - crediya-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crediya_authentication_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Authentication Service
  authentication-service:
    build:
      context: ./deployment
      dockerfile: Dockerfile
    container_name: crediya-auth-service
    environment:
      # Database Configuration
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: crediya_auth
      DB_USER: crediya_user
      DB_PASSWORD: crediya_password
      DB_URL: r2dbc:postgresql://postgres-auth:5433/crediya_auth
      
      # R2DBC Configuration
      R2DBC_HOST: postgres-auth
      R2DBC_PORT: 5432
      R2DBC_DATABASE: crediya_authentication_db
      R2DBC_SCHEMA: public
      R2DBC_USERNAME: postgres
      R2DBC_PASSWORD: nueva_password
      
      # Server Configuration
      SERVER_PORT: 8080
      
      # JWT Configuration
      JWT_SECRET: mySecretKeyForCrediyaAuthenticationServiceThatIsLongEnoughForHS256
      JWT_EXPIRATION: 86400000
      
      # CORS Configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_CO_COM_CREDIYA: DEBUG
      
      # Spring Profiles
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8080:8080"
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - crediya-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

networks:
  crediya-network:
    driver: bridge
    name: crediya-network

volumes:
  postgres_auth_data:
    driver: local
