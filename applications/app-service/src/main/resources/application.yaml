server:
  port: 8080
spring:
  application:
    name: "authentication-service"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    host: ${R2DBC_HOST:localhost}
    port: ${R2DBC_PORT:5433}
    database: ${R2DBC_DATABASE:crediya_db}
    schema: ${R2DBC_SCHEMA:public}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:changeme}
  sql:
    init:
      mode: always
      schema-locations: classpath*:schema.sql
      data-locations: classpath*:data.sql
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
